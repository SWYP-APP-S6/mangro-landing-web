# /etc/nginx/sites-available/mangro.cloud 로 복사해서 쓴다.
# certbot --nginx -d mangro.cloud -d www.mangro.cloud 가 443 블록과 리다이렉트를 자동으로 붙인다.
# NCP 는 IPv6 미지원이라 listen [::]:80 을 넣지 않는다.

server {
    listen 80;
    server_name www.mangro.cloud;
    return 301 https://mangro.cloud$request_uri;
}

server {
    listen 80;
    server_name mangro.cloud;

    root /var/www/landing;
    index index.html;

    # 페이지가 하나뿐이라 SPA fallback 을 두지 않는다 — 없는 경로는 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Vite 가 만든 해시 파일(index-AbC123xy.js 등)만 영구 캐시한다.
    location ~* ^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # public/assets 의 이미지는 해시 없는 이름(icon_app.png 등)으로 같은 /assets/ 에 섞인다.
    # admin 처럼 /assets/ 전체를 1년 캐시하면 같은 이름으로 이미지를 바꿨을 때 1년간 옛 이미지가 보인다.
    location /assets/ {
        expires 1h;
    }

    location /fonts/ {
        expires 7d;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
